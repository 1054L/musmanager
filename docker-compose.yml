services:
  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-!ChangeMe!}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-!ChangeMe!}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/mysql:rw
    networks:
      - proxy

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-!ChangeMe!}@database:3306/${MYSQL_DATABASE:-app}?serverVersion=8.0.32&charset=utf8mb4
      APP_ENV: dev
      APP_SECRET: abcdefg123456
      DEFAULT_URI: https://tu-dominio.com
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
    volumes:
      - ./api:/var/www/html
      - api_vendor:/var/www/html/vendor
    depends_on:
      database:
        condition: service_healthy
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mi-app-api.rule=Host(`api.tu-dominio.com`)"
      - "traefik.http.routers.mi-app-api.entrypoints=web"
      - "traefik.http.services.mi-app-api.loadbalancer.server.port=80"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    environment:
      - VITE_PORT=5173
      - VITE_API_PROXY=http://api:80
      - VITE_API_BASE_URL=https://api.tu-dominio.com
      - VITE_MERCURE_URL=https://tu-dominio.com/.well-known/mercure
    depends_on:
      - api
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mi-app-web.rule=Host(`tu-dominio.com`)"
      - "traefik.http.routers.mi-app-web.entrypoints=web"
      - "traefik.http.services.mi-app-web.loadbalancer.server.port=5173"

  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: :80
      MERCURE_PUBLISHER_JWT_KEY: "!ChangeMeMercurePublisherJWTKey!"
      MERCURE_EXTRA_DIRECTIVES: |
        anonymous
        demo
        cors_origins https://tu-dominio.com
      CORS_ALLOWED_ORIGINS: "*"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mi-app-mercure.rule=Host(`tu-dominio.com`) && PathPrefix(`/.well-known/mercure`)"
      - "traefik.http.routers.mi-app-mercure.entrypoints=web"
      - "traefik.http.services.mi-app-mercure.loadbalancer.server.port=80"

networks:
  proxy:
    external: true

volumes:
  database_data:
    external: true
  web_node_modules:
  api_vendor: